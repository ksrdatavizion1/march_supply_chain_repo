version: 2

sources:
  - name: orders  # name of source
    schema: landing
    database: "{{ target.database }}"
    tables:
      - name: cust_order
        identifier: raw_customer_order
  - name: items  # 2nd name 
    schema: landing
    database: "{{ target.database }}"
    tables:
      - name: inventory
        identifier: raw_inventory
  - name : warehouse_loc  
    schema: raw
    database: "{{ target.database }}"
    tables:
      - name: warehouse
        identifier: WAREHOUSE_LOCATIONS